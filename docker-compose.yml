services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TRIPLE_AGENT_API_URL: "http://localhost:8080"
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
