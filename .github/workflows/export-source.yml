name: Export source snapshot

on:
  push:
    branches:
      - chatgpt/triple-agent-refactor-20260820
  pull_request:
    branches:
      - mahdi
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          zip -r /tmp/triple-agent-source.zip . -x '.git/*' '.git/**'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: triple-agent-source
          path: /tmp/triple-agent-source.zip
          if-no-files-found: error
          retention-days: 1
