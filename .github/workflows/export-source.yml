name: Export source snapshot

on:
  push:
    branches:
      - chatgpt/triple-agent-refactor-20260820
  pull_request:
    branches:
      - mahdi
      - chatgpt/triple-agent-refactor-20260820
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          zip -r /tmp/triple-agent-refactor.zip . \
            -x '.git/*' '.git/**' \
            -x '.github/workflows/export-source.yml' \
            -x '.verify-trigger'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: triple-agent-refactor
          path: /tmp/triple-agent-refactor.zip
          if-no-files-found: error
          retention-days: 1
